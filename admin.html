<!doctype html>
  <html lang="en">
  <head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Admin — Submissions</title>
  <meta name="robots" content="noindex, nofollow">
  <style>
  :root{font-family:system-ui,-apple-system,Segoe UI,Roboto,Arial,sans-serif}
  body{margin:0;background:#0b0f14;color:#e6edf3}
.wrap{max-width:1000px;margin:0 auto;padding:24px}
h1{font-size:20px;margin:0 0 16px}
.card{background:#111820;border:1px solid #24303c;border-radius:10px;padding:20px;margin-bottom:16px}
input,select,button{font-size:14px;padding:8px 10px;border-radius:6px;border:1px solid #2a3744;background:#0b0f14;color:#e6edf3}
button{cursor:pointer;background:#2563eb;border-color:#2563eb;color:#fff}
button:hover{background:#1d4ed8}
  button.secondary{background:transparent;color:#9fb3c8;border-color:#2a3744}
table{width:100%;border-collapse:collapse;font-size:13px}
th,td{text-align:left;padding:8px;border-bottom:1px solid #24303c}
th{color:#9fb3c8;font-weight:600}
tr:hover{background:#0e1520}
  .badge{padding:2px 8px;border-radius:999px;font-size:11px;border:1px solid #2a3744}
.row{display:flex;gap:8px;align-items:center;flex-wrap:wrap}
#err{color:#f87171;font-size:13px;min-height:18px}
#loginView{max-width:360px;margin:80px auto}
a{color:#60a5fa}
  .muted{color:#9fb3c8;font-size:12px}
pre{white-space:pre-wrap;background:#0b0f14;border:1px solid #24303c;border-radius:8px;padding:12px;font-size:12px}
.close{background:transparent;border:none;color:#9fb3c8;font-size:18px;cursor:pointer}
</style>
  </head>
  <body>
  <div id="loginView" class="card" style="display:none">
  <h1>Admin Login</h1>
  <div class="row" style="flex-direction:column;align-items:stretch;gap:10px">
  <input id="pw" type="password" placeholder="Admin password" autocomplete="current-password">
  <button id="loginBtn">Log in</button>
  <div id="err"></div>
  </div>
  </div>
  <div id="dashView" class="wrap" style="display:none">
  <div class="row" style="justify-content:space-between">
  <h1>Submissions</h1>
  <div class="row">
  <button class="secondary" id="refreshBtn">Refresh</button>
  <button class="secondary" id="logoutBtn">Log out</button>
  </div>
  </div>
  <div class="card">
<div id="listErr" class="muted"></div>
  <table>
<thead>
  <tr><th>Ref</th><th>Business</th><th>Type</th><th>Date</th><th>Status</th><th></th></tr>
  </thead>
  <tbody id="rows"></tbody>
  </table>
  </div>
  </div>
  <div id="detailOverlay" style="display:none;position:fixed;inset:0;background:rgba(0,0,0,.6);align-items:flex-start;justify-content:center;overflow:auto;padding:40px 16px">
<div class="card" style="max-width:800px;width:100%;position:relative">
  <button class="close" id="closeDetail" style="position:absolute;top:10px;right:14px">✕</button>
  <div id="detailBody"></div>
  </div>
  </div>
  <script>
  const TOKEN_KEY = 'admin_session_token';
const STATUSES = ['New','Contacted','Quoted','Negotiating','Won','Lost'];
function token(){ return localStorage.getItem(TOKEN_KEY) || ''; }
  function setToken(t){ if(t) localStorage.setItem(TOKEN_KEY, t); else localStorage.removeItem(TOKEN_KEY); }
function show(view){
  document.getElementById('loginView').style.display = view==='login' ? 'block' : 'none';
document.getElementById('dashView').style.display = view==='dash' ? 'block' : 'none';
}
async function api(path, opts={}){
const res = await fetch(path, {
...opts,
  headers: { ...(opts.headers||{}), 'Authorization': 'Bearer ' + token() }
});
if(res.status === 401){ setToken(''); show('login'); throw new Error('Session expired, please log in again'); }
const data = await res.json().catch(()=>({}));
if(!res.ok) throw new Error(data.error || ('Request failed (' + res.status + ')'));
return data;
}
async function login(){
const pw = document.getElementById('pw').value;
const err = document.getElementById('err');
err.textContent = '';
if(!pw){ err.textContent = 'Enter password'; return; }
try{
const res = await fetch('/api/login', {
  method:'POST',
headers:{'Content-Type':'application/json'},
  body: JSON.stringify({ password: pw })
  });
const data = await res.json().catch(()=>({}));
if(!res.ok) throw new Error(data.error || 'Login failed');
setToken(data.token);
document.getElementById('pw').value = '';
  show('dash');
loadList();
}catch(e){
err.textContent = e.message;
}
}
function logout(){
  setToken('');
show('login');
}
function fmtDate(iso){
  try{ return new Date(iso).toLocaleString(); }catch(e){ return iso || ''; }
}
async function loadList(){
const errEl = document.getElementById('listErr');
const rows = document.getElementById('rows');
errEl.textContent = 'Loading…';
rows.innerHTML = '';
  try{
const data = await api('/api/list');
errEl.textContent = '';
  (data.items || []).forEach(item => {
    const tr = document.createElement('tr');
    tr.innerHTML =
      '<td>' + esc(item.ref) + '</td>' +
      '<td>' + esc(item.bizName || '') + '</td>' +
      '<td>' + esc(item.bizType || item.projectType || '') + '</td>' +
      '<td>' + esc(fmtDate(item.createdAt)) + '</td>' +
      '<td><span class="badge">' + esc(item.status || 'New') + '</span></td>' +
      '<td><button class="secondary view-btn" data-ref="' + esc(item.ref) + '">View</button></td>';
rows.appendChild(tr);
  });
document.querySelectorAll('.view-btn').forEach(btn=>{
  btn.addEventListener('click', () => openDetail(btn.dataset.ref));
});
      }catch(e){
  errEl.textContent = e.message;
}
}
function esc(s){
  return String(s == null ? '' : s).replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
}
async function openDetail(ref){
const overlay = document.getElementById('detailOverlay');
const body = document.getElementById('detailBody');
overlay.style.display = 'flex';
body.innerHTML = 'Loading…';
try{
const data = await api('/api/item?ref=' + encodeURIComponent(ref));
const item = data.item || {};
const statusOptions = STATUSES.map(s =>
'<option value="' + s + '"' + (s === (item.status||'New') ? ' selected' : '') + '>' + s + '</option>'
).join('');
body.innerHTML =
'<h2 style="margin-top:0">' + esc(item.ref) + '</h2>' +
'<div class="row" style="margin-bottom:12px">' +
'<label class="muted">Status:</label>' +
'<select id="statusSelect">' + statusOptions + '</select>' +
'<button id="saveStatusBtn">Save</button>' +
'<span id="statusMsg" class="muted"></span>' +
'</div>' +
'<pre>' + esc(JSON.stringify(item, null, 2)) + '</pre>';
document.getElementById('saveStatusBtn').addEventListener('click', async () => {
  const newStatus = document.getElementById('statusSelect').value;
  const msg = document.getElementById('statusMsg');
msg.textContent = 'Saving…';
try{
await api('/api/status', {
method:'POST',
headers:{'Content-Type':'application/json'},
body: JSON.stringify({ ref, status: newStatus })
});
msg.textContent = 'Saved';
loadList();
}catch(e){
msg.textContent = e.message;
}
});
}catch(e){
body.innerHTML = '<p style="color:#f87171">' + esc(e.message) + '</p>';
}
}
document.getElementById('loginBtn').addEventListener('click', login);
document.getElementById('pw').addEventListener('keydown', e => { if(e.key === 'Enter') login(); });
document.getElementById('refreshBtn').addEventListener('click', loadList);
document.getElementById('logoutBtn').addEventListener('click', logout);
document.getElementById('closeDetail').addEventListener('click', () => {
document.getElementById('detailOverlay').style.display = 'none';
});
if(token()){
show('dash');
loadList();
} else {
show('login');
}
</script>
</body>
</html>
